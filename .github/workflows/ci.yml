name: CI

# Runs on every push to dev/production and on any PR targeting those branches.
# Fails fast if any app fails to build — prevents broken code reaching production.
on:
  push:
    branches: [main, dev, production]
  pull_request:
    branches: [dev, production]

jobs:
  build:
    name: Build — ${{ github.ref_name || github.head_ref }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # pnpm version is read from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @clockwork/shared
        run: pnpm --filter @clockwork/shared build

      # ── API ────────────────────────────────────────────────────────────────
      - name: Build API (NestJS 11)
        run: pnpm --filter api build

      # ── Admin portal ────────────────────────────────────────────────────────
      - name: Build admin portal (Next.js 15)
        run: pnpm --filter admin build

      # ── Desktop ─────────────────────────────────────────────────────────────
      # Only renderer (Vite) and main process (tsc --noEmit) here.
      # Full electron-builder packaging happens in release.yml on version tags.
      - name: Build desktop renderer
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm --filter desktop exec vite build

      - name: Type-check desktop main process
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm --filter desktop exec tsc -p tsconfig.electron.json --noEmit
