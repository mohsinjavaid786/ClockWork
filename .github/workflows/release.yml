name: Release Desktop App

# Triggered by pushing a version tag from the production branch.
# Workflow: merge dev → production, then:
#   git tag v1.2.3 && git push origin production --tags
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  # ── Build macOS installer (.dmg + .zip) ──────────────────────────────────────
  build-macos:
    name: Build macOS (Apple Silicon + Intel)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # pnpm version is read from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # electron-builder can't collect pnpm's nested transitive deps, so the
      # desktop must be packaged from a hoisted (flat) node_modules. Enable it
      # only for this CI run — the committed pnpm-workspace.yaml stays isolated
      # so the Vercel (admin) and Railway (api) builds keep working.
      - name: Enable hoisted node_modules (desktop packaging only)
        shell: bash
        run: |
          printf '\nnodeLinker: hoisted\nshamefullyHoist: true\n' >> pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @clockwork/shared
        run: pnpm --filter @clockwork/shared build

      - name: Build desktop (renderer + main)
        run: pnpm --filter desktop build

      - name: Package macOS installer
        # --publish never: we upload via create-release job below
        # API_URL (repo variable) is baked into the build via extraMetadata.
        env:
          API_URL: ${{ vars.API_URL }}
        run: cd apps/desktop && pnpm exec electron-builder --mac --publish never --config electron-builder.config.js

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*-mac.yml

  # ── Build Windows installer (.exe) ───────────────────────────────────────────
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # pnpm version is read from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # electron-builder can't collect pnpm's nested transitive deps, so the
      # desktop must be packaged from a hoisted (flat) node_modules. Enable it
      # only for this CI run — the committed pnpm-workspace.yaml stays isolated
      # so the Vercel (admin) and Railway (api) builds keep working.
      - name: Enable hoisted node_modules (desktop packaging only)
        shell: bash
        run: |
          printf '\nnodeLinker: hoisted\nshamefullyHoist: true\n' >> pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @clockwork/shared
        run: pnpm --filter @clockwork/shared build

      - name: Build desktop (renderer + main)
        run: pnpm --filter desktop build

      - name: Package Windows installer
        # API_URL (repo variable) is baked into the build via extraMetadata.
        env:
          API_URL: ${{ vars.API_URL }}
        run: cd apps/desktop && pnpm exec electron-builder --win --publish never --config electron-builder.config.js

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml

  # ── Create GitHub Release with all artifacts ─────────────────────────────────
  create-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: List release files
        run: find artifacts -type f | sort

      # Pull the curated notes for this version out of CHANGELOG.md and prepend
      # them to the standing install instructions. This becomes the release body,
      # so GitHub Releases mirror the maintained changelog.
      - name: Assemble release notes
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          notes=$(awk -v ver="$VER" '
            /^## \[/ { if (f) exit; if (index($0, "[" ver "]") > 0) { f=1; next } }
            f { print }
          ' CHANGELOG.md)
          {
            echo "## What's new in Clockwork ${GITHUB_REF_NAME}"
            echo
            if [ -n "$notes" ]; then echo "$notes"; else echo "_See the commit history for changes in this release._"; fi
            cat <<'EOF'

          ### Download

          | Platform | File | Notes |
          |---|---|---|
          | **macOS** | `Clockwork-*.dmg` | Apple Silicon + Intel universal |
          | **Windows** | `Clockwork Setup *.exe` | Windows 10/11 x64 |

          ### macOS — first-time installation
          1. Download `Clockwork-*.dmg`
          2. Open the `.dmg` and drag **Clockwork** to Applications
          3. macOS will say *"Apple could not verify Clockwork is free of malware"* (the app isn't notarized). **First launch only:**
             - **System Settings → Privacy & Security** → scroll down → **Open Anyway** → authenticate, **or**
             - Terminal: `xattr -dr com.apple.quarantine /Applications/Clockwork.app`
             *(Safe to proceed — the app is ad-hoc signed but not notarized through a paid Apple Developer account.)*

          ### Windows — installation
          1. Download `Clockwork Setup *.exe`
          2. Run the installer
          3. If SmartScreen appears → **More info** → **Run anyway**

          ---
          > **Auto-update:** Clockwork checks for updates automatically on every launch.
          > **Full changelog:** see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          EOF
          } > release-notes.md
          echo "----- release-notes.md -----"
          cat release-notes.md

      # Publish installers to the public Supabase bucket under stable "latest"
      # names so invite emails can link to them directly (repo stays private).
      # Requires repo secrets SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY; skipped
      # if they're not set.
      - name: Publish installers to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Supabase secrets not set — skipping installer upload."
            exit 0
          fi
          upload() {
            local file="$1" dest="$2"
            echo "Uploading $file → installers/latest/$dest"
            curl -fsSL -X POST \
              "$SUPABASE_URL/storage/v1/object/installers/latest/$dest" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "x-upsert: true" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file"
            echo
          }
          dmg=$(ls artifacts/macos/*.dmg | head -1)
          exe=$(ls artifacts/windows/*.exe | head -1)
          upload "$dmg" "Clockwork.dmg"
          upload "$exe" "Clockwork.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Clockwork ${{ github.ref_name }}
          draft: false
          prerelease: false
          # Append GitHub's auto-generated commit/PR list below the curated notes.
          generate_release_notes: true
          body_path: release-notes.md
          files: |
            artifacts/macos/*
            artifacts/windows/*
