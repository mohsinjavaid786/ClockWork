# NOTE: node_modules use pnpm's default isolated layout so Vercel can find
# `next` in apps/admin/node_modules. The desktop electron-builder packaging
# needs a HOISTED layout instead — that is enabled only in the release workflow
# (it appends nodeLinker/shamefullyHoist before installing), not here, so it
# doesn't break the Vercel/admin and Railway/api builds.
packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': false
  active-win: true
  electron: true
  esbuild: true
  sharp: true
  uiohook-napi: true

# Security fixes for transitive dependencies whose parents retain old ranges.
overrides:
  sharp: ^0.35.5
  multer: ^2.5.0
  tar: ^7.5.23
  postcss: ^8.5.33
  qs: ^6.17.1
  "js-yaml@^3": ^3.14.2
  "js-yaml@^4": ^4.3.2
  "brace-expansion@^1": ^1.1.21
  "brace-expansion@^2": ^2.1.7
  builder-util-runtime: ^9.7.0
  ip-address: ^10.7.6
  "nanoid@^3": ^3.3.18
  source-map-js: ^1.2.2
  proxy-addr: ^2.0.8
  "body-parser@^2": ^2.4.0
