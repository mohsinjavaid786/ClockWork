<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 'unsafe-eval' is required by the Vite dev server (HMR/react-refresh); the renderer loads
         only local bundled content and reaches the API via the contextBridge, never direct fetch.
         localhost connect-src covers the dev server + HMR websocket. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data:; connect-src 'self' ws://localhost:* http://localhost:*" />
    <title>Clockwork</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
